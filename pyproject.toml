[project]
name = "nppes-over-time"
version = "0.1.0"
description = "A reproducible, file-based SCD Type 2 history of the CMS NPPES provider registry, built with DuckDB."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Nathan Sutton", email = "nasutton@gmail.com" }]
keywords = ["NPPES", "NPI", "CMS", "healthcare", "providers", "SCD2", "panel data", "DuckDB"]
dependencies = [
    "duckdb>=1.5.6",
    "pyarrow>=26.0.0",
]

[project.scripts]
nppes-over-time = "nppes_over_time.cli:main"

[project.urls]
Repository = "https://github.com/nathansutton/nppes-over-time"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pandas>=2.2",
]
research = [
    "differences>=0.3.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "pyfixest>=0.60.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nppes_over_time"]

[tool.pytest.ini_options]
testpaths = ["tests"]
